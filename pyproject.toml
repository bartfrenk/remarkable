[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remarkable"
version = "0.1.0"
description = "Push PDF documents to a reMarkable tablet via the reMarkable Cloud API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.13.5",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=1.2.0",
]

[project.scripts]
remarkable = "remarkable.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99

[tool.pyright]
reportUnusedCallResult = false
reportAny = false
reportImplicitStringConcatenation = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
