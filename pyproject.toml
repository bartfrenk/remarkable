[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remarkable"
version = "0.1.0"
description = "Upload and download reMarkable documents via the reMarkable Cloud API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "pydantic>=2.13.4",
    "reportlab>=5.0.1",
    "rmc>=0.3.0",
    "rmscene>=0.6.1",
    "svglib>=2.2.0",
]


[project.scripts]
remarkable = "remarkable.__main__:main"

[dependency-groups]
test = ["pytest>=7.0", "pytest-asyncio>=1.2.0"]
lint = ["black>=24.2.0", "isort>=5.6.4", "basedpyright>=1.31.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py312"]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99

[tool.pyright]
reportUnusedCallResult = false
reportAny = false
reportImplicitStringConcatenation = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
